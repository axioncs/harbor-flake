
name: Check for Harbor updates

on:
  schedule:
    # Every 6 hours (upstream beta builds land roughly every few days)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs race on the same version.json.
concurrency:
  group: harbor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run update script
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./update.sh
          if git diff --quiet -- version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            beta=$(jq -r '.beta.version' version.json)
            stable=$(jq -r '.stable.version' version.json)
            echo "summary=beta ${beta}, stable ${stable}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build (beta)
        if: steps.update.outputs.changed == 'true'
        run: nix build .#beta --print-build-logs

      - name: Verify build (stable)
        if: steps.update.outputs.changed == 'true'
        run: nix build .#stable --print-build-logs

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump Harbor (${{ steps.update.outputs.summary }})"
          git push
